<script>
/* ===========================================================================
 * 시뮬레이터 v2 엔진 — 피처(실효 공정값)가 GPC·균일도를 만든다. (설계: sim_v2/model.py)
 *
 *   실효 피처 = 노브 설정값 + 숨은 교란 d(t)
 *   GPC      = 1.10 + Σ 피처별 GPC 항 + 잡음
 *   균일도    = 0.90 + Σ 피처별 균일도 항 + 잡음
 *
 * 이상 = 피처 하나에 교란을 넣는 것. 노브를 누르면 실효 피처가 바뀌어 같은 식으로 지표가 움직인다.
 * 화면(app 블록)은 v1 과 같은 API(Sim·tick·view·gt·apply·hitTest)만 쓴다.
 * =========================================================================== */
(function (root) {
"use strict";

const DT = 0.5, WINDOW_TICKS = 1200, PREROLL_TICKS = 1200, EPISODE_TICKS = PREROLL_TICKS + 1200;
const CHART_POINTS = 120, ACTION_DWELL_S = 30;
const GPC_BASE = 1.10, GPC_BAND = [1.05, 1.15], U_BASE = 0.90, U_BAND = [0.50, 1.30];
const GPC_NOISE = 0.006, U_NOISE = 0.02, OSC_PERIOD_S = 40;

const KNOBS = {
  temp:  { base: 255,  step: 5,    min: 230,  max: 280,  dp: 0, unit: "°C",   label: "온도" },
  press: { base: 1.4,  step: 0.1,  min: 0.8,  max: 2.2,  dp: 1, unit: "Torr", label: "압력" },
  pulse: { base: 0.10, step: 0.01, min: 0.04, max: 0.20, dp: 2, unit: "s",    label: "펄스" },
  purge: { base: 4.5,  step: 0.5,  min: 2.0,  max: 9.0,  dp: 1, unit: "s",    label: "퍼지" },
  flow:  { base: 225,  step: 25,   min: 100,  max: 400,  dp: 0, unit: "sccm", label: "유량" }
};
const KNOB_ORDER = ["temp", "press", "pulse", "purge", "flow"];
// 정상 범위(공정 창). 창 안에서는 지표가 조금만 움직이고, 하한·상한을 넘으면 가파르게 나빠진다.
const WINDOW = { temp: [245, 265], press: [1.2, 1.6], pulse: [0.08, 0.14], purge: [3.5, 6.0], flow: [175, 300] };
const CORRECTION_LIMIT = { temp: 265, press: 1.6, pulse: 0.14, purge: 6.0, flow: 300 };   // 화면의 '상한' = 창 위쪽 끝
function limitOf(k) { return WINDOW[k][1]; }

// 이상 = 교란이 들어가는 피처. normal 은 교란 없음
const FAULT_TYPES = ["normal", "temp", "purge", "pulse", "press", "flow"];
const MECHANISM = {
  normal: "정상 — 교란 없음",
  temp:   "온도 — 벽 증착 누적으로 실효 온도가 서서히 떨어짐",
  purge:  "퍼지 — 배기 밸브 이상으로 퍼지 효율이 갑자기 떨어짐",
  pulse:  "펄스 — 버블러 고갈로 30초 뒤부터 전구체 공급이 꺾이며 줄어듦",
  press:  "압력 — 배기 제어 불안정으로 압력이 40초 주기로 흔들리며 커짐",
  flow:   "유량 — MFC 드리프트로 운반 유량이 줄어듦"
};
// 맞는 조치: 교란 피처를 되돌리는 방향
const FIX = { temp: "temp_up", purge: "purge_up", pulse: "pulse_up", press: "press_down", flow: "flow_up" };

function smooth(x) { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); }
/** 숨은 교란 d(s). s = 주입 후 초 */
/** 숨은 교란 d(s). s = 주입 후 초. 실제값을 하한(압력은 양쪽 한계) 쪽으로 끌고 가서 넘긴다 */
function disturb(fault, s) {
  if (s < 0) return 0;
  switch (fault) {
    case "temp":  return -Math.min(30, 20 * s / 200);                 // 255 → 245(하한) 100초 → 235(150초)
    case "purge": return -2.0 * (1 - Math.exp(-s / 5));               // 4.5 → 2.5 (하한 3.5 아래로 급락)
    case "pulse": return -0.04 * smooth((s - 30) / 120);              // 0.10 → 0.06 (하한 0.08 아래로 꺾여 내려감)
    case "press": return 0.24 * (1 - Math.exp(-s / 60));              // 1.4 ± 0.24 → 1.16~1.64 (양쪽 한계를 오감)
    case "flow":  return -100 * (1 - Math.exp(-s / 40));              // 225 → 125 (하한 175 아래로)
    default:      return 0;
  }
}
const lo = function (k, v) { return Math.max(0, WINDOW[k][0] - v); };   // 하한을 넘은 만큼
const hi = function (k, v) { return Math.max(0, v - WINDOW[k][1]); };   // 상한을 넘은 만큼
/** 피처 → 지표 항. 창 안 = 완만한 기울기(버튼을 누르면 보이는 정도), 창 밖 = 가파른 기울기 */
function gpcTerms(e, amp, tS) {
  return {
    temp:  -0.002 * (e.temp - 255) + 0.008 * lo("temp", e.temp) - 0.006 * hi("temp", e.temp),   // 하한 아래: 응축 → GPC↑, 상한 위: 탈착 → GPC↓
    purge:  0.02 * Math.max(0, 4.5 - e.purge) + 0.10 * lo("purge", e.purge),                      // 퍼지 부족 → 잔류 가스 CVD → GPC↑ (넉넉하면 포화)
    pulse: -1.0 * Math.max(0, 0.10 - e.pulse) - 5.0 * lo("pulse", e.pulse),                       // 전구체 부족 → 미포화 → GPC↓ (넉넉하면 포화)
    press:  0.10 * (e.press - 1.4) + 0.25 * amp * Math.sin(2 * Math.PI * tS / OSC_PERIOD_S),      // 압력↑ → 체류↑ → GPC↑, 진동은 그대로 GPC 진동
    flow:   (e.flow >= 225 ? 0.0004 : 0.0003) * (e.flow - 225)
  };
}
function uTerms(e, amp) {
  return {
    temp:  0.002 * Math.abs(e.temp - 255) + 0.004 * lo("temp", e.temp) + 0.03 * hi("temp", e.temp),
    purge: 0.05 * Math.max(0, 4.5 - e.purge) + 0.40 * lo("purge", e.purge) - 0.02 * Math.max(0, e.purge - 4.5),
    pulse: 0.5 * Math.max(0, 0.10 - e.pulse) + 3.0 * lo("pulse", e.pulse) + 2.0 * Math.max(0, e.pulse - 0.10) + 4.0 * hi("pulse", e.pulse),
    press: 1.0 * amp + 0.3 * Math.abs(e.press - 1.4) + 1.0 * (lo("press", e.press) + hi("press", e.press)),
    flow:  0.002 * Math.max(0, 225 - e.flow) + 0.007 * lo("flow", e.flow) + 0.0012 * Math.max(0, e.flow - 225) + 0.005 * hi("flow", e.flow)
  };
}
const sum = function (o) { let s = 0; for (const k in o) s += o[k]; return s; };

function mulberry32(a) {
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

function Sim(opts) {
  opts = opts || {};
  this.seed = opts.seed || 1; this.faultType = FAULT_TYPES.indexOf(opts.faultType) >= 0 ? opts.faultType : "normal";
  this.injectTick = opts.injectTick != null ? opts.injectTick : PREROLL_TICKS;
  this.rand = mulberry32(this.seed);
  const r = this.rand; let spare = null;
  this.gauss = function () { if (spare !== null) { const s = spare; spare = null; return s; }
    let u = 0, v = 0; while (u === 0) u = r(); v = r(); const m = Math.sqrt(-2 * Math.log(u));
    spare = m * Math.sin(2 * Math.PI * v); return m * Math.cos(2 * Math.PI * v); };
  this.t = 0; this.clockS = 9 * 3600 + Math.floor(this.rand() * 3600);
  this.knobs = {}; this.knobSeries = {}; this.effSeries = {};
  for (const k of KNOB_ORDER) { this.knobs[k] = KNOBS[k].base; this.knobSeries[k] = []; this.effSeries[k] = []; }
  this.gpcSeries = []; this.uSeries = []; this.actionLog = []; this.pending = null;
  this.wobG = 0; this.wobU = 0; this.cleanRequested = false;
  this.state();
}

/** 지금 노브·교란으로 실효 피처와 지표(잡음 없는 값)를 계산한다. */
Sim.prototype.state = function () {
  const s = (this.t - this.injectTick) * DT, d = disturb(this.faultType, s);
  const e = Object.assign({}, this.knobs);
  if (this.faultType !== "press" && this.faultType !== "normal") e[this.faultType] += d;
  const amp = this.faultType === "press" ? d * Math.min(1, Math.max(0, (this.knobs.press - 1.2) / 0.2)) : 0;
  const tg = gpcTerms(e, amp, this.t * DT), tu = uTerms(e, amp);
  this.dist = d; this.eff = e; this.amp = amp; this.termsG = tg; this.termsU = tu;
  this.gpcTrue = GPC_BASE + sum(tg); this.uTrue = U_BASE + sum(tu);
};

/** 화면에 보여 줄 실효 피처 — 압력은 진동 진폭만큼 실제로 흔들린다 */
Sim.prototype.effView = function () {
  const e = Object.assign({}, this.eff);

    t: this.t, clock: this.clockStr(), gpc: this.gpcDisplay, uniformity: this.uDisplay,
    gpcPoints: downsample(this.gpcSeries, NP, W), uPoints: downsample(this.uSeries, NP, W),

    markers: this.actionLog.filter(function (e) { return e.tick >= winStart; })

const r4 = function (o) { const out = {}; for (const k in o) out[k] = +(+o[k]).toFixed(4); return out; };

    gpc_true: +this.gpcTrue.toFixed(4), gpc_display: +(this.gpcDisplay ?? this.gpcTrue).toFixed(4),
    uniformity_true: +this.uTrue.toFixed(4), uniformity: +(this.uDisplay ?? this.uTrue).toFixed(4),

  DT: DT, WINDOW_TICKS: WINDOW_TICKS, PREROLL_TICKS: PREROLL_TICKS, EPISODE_TICKS: EPISODE_TICKS,

<script>/* 이상 감지 함수 + 폐루프 에이전트 (시뮬레이터 v2). reader/detect_v2.py 와 같은 규칙 — parity 시험으로 확인한다.

<script>
const FAULTS = ["normal", "temp", "purge", "pulse", "press", "flow"];
const KO = { normal: "정상", temp: "온도", purge: "퍼지", pulse: "펄스", press: "압력", flow: "유량",
  noop: "대기", temp_up: "온도 +", temp_down: "온도 −", purge_up: "퍼지 +", purge_down: "퍼지 −", pulse_up: "펄스 +", pulse_down: "펄스 −",
  press_up: "압력 +", press_down: "압력 −", flow_up: "유량 +", flow_down: "유량 −", request_clean: "클리닝 요청" };
const INJECT_AFTER_S = 120;      // 시작 2분 뒤 주입
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
let runs = [], paused = false, baseSeed = 1;

function start() {
  baseSeed = 1 + Math.floor(Math.random() * 9000);
  runs = FAULTS.map((f, i) => {
    const sim = new SIM.Sim({ seed: baseSeed + i, faultType: f, injectTick: 1200 + INJECT_AFTER_S * 2 });
    for (let k = 0; k < 1200; k++) sim.tick();          // 10분 창을 미리 채운다
    return { f: f, sim: sim, ag: new AGENT.Agent(), presses: [], firstAt: null, nowS: -INJECT_AFTER_S };
  });
  $("grid").innerHTML = runs.map((r, i) => `<section class="card" id="c${i}"><div class="hd"><b>${KO[r.f]}${r.f !== "normal" ? " 교란" : ""}</b>
    <span class="mech">${esc(SIM.MECHANISM[r.f].split(" — ")[1] || "")}</span></div>
    <div class="charts"><svg id="g${i}" viewBox="0 0 300 150" role="img" aria-label="${KO[r.f]} GPC"></svg><svg id="u${i}" viewBox="0 0 300 150" role="img" aria-label="${KO[r.f]} 균일도"></svg></div>
    <div class="knobs" id="k${i}"></div><div class="judge" id="j${i}"></div><div class="log" id="l${i}"></div></section>`).join("");
  draw();
}

function tickAll(simSeconds) {
  for (const r of runs) for (let s = 0; s < simSeconds; s++) {
    r.sim.tick(); r.sim.tick(); r.nowS += 1;
    const since = (r.sim.t - r.sim.injectTick) * SIM.DT;
    const res = r.ag.step(r.sim, since, id => r.sim.apply(id));
    if (res.act !== "noop") {
      r.presses.push({ t: since, act: res.act, why: res.why, undo: res.why.indexOf("되돌리") >= 0 });
      if (r.firstAt === null && !res.why.includes("되돌리")) r.firstAt = since;
    }
  }
}

function chart(el, pts, lo, hi, band, color, tick, presses, sim) {
  const W = 300, H = 150, L = 34, R = 6, T = 8, B = 18, n = pts.length;
  const X = i => L + (W - L - R) * i / Math.max(1, 119), Y = v => H - B - (Math.min(hi, Math.max(lo, v)) - lo) / (hi - lo) * (H - T - B);
  let g = `<rect x="${L}" y="${Y(band[1])}" width="${W - L - R}" height="${Y(band[0]) - Y(band[1])}" fill="var(--band)"/>`;
  for (let v = lo; v <= hi + 1e-9; v += tick) g += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${L - 4}" y="${Y(v) + 3.5}" text-anchor="end">${v.toFixed(2)}</text>`;
  g += `<text x="${L}" y="${H - 4}">−10분</text><text x="${W - R}" y="${H - 4}" text-anchor="end">지금</text>`;
  const off = 120 - n, winStart = sim.t - 1200;
  const injX = L + (W - L - R) * ((sim.injectTick - winStart) / 1200);
  if (sim.faultType !== "normal" && injX >= L) g += `<line x1="${injX}" x2="${injX}" y1="${T}" y2="${H - B}" stroke="var(--mut)" stroke-dasharray="3 3"/>`;
  presses.forEach(p => { const tk = sim.injectTick + p.t / SIM.DT, x = L + (W - L - R) * ((tk - winStart) / 1200);
    if (x >= L) g += `<line x1="${x}" x2="${x}" y1="${H - B - 7}" y2="${H - B}" stroke="${p.undo ? "var(--undo)" : (p.ok === false ? "var(--bad)" : "var(--good)")}" stroke-width="2.5"><title>${esc(KO[p.act])} · ${esc(p.why)}</title></line>`; });
  g += `<path d="${pts.map((p, i) => (i ? "L" : "M") + X(i + off).toFixed(1) + " " + Y(p.v).toFixed(1)).join("")}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round"/>`;
  if (n) g += `<circle cx="${X(n - 1 + off)}" cy="${Y(pts[n - 1].v)}" r="3" fill="${color}"/>`;
  el.innerHTML = g;
}

function draw() {
  let t = `<tr><th>교란</th><th>지금 판정</th><th>지금 조치 · 이유</th><th>첫 조치</th><th>누른 것</th><th>GPC</th><th>균일도</th><th>상태</th></tr>`;
  runs.forEach((r, i) => {
    const s = r.sim, v = s.view(), g = s.gt(), last = r.ag.last, since = (s.t - s.injectTick) * SIM.DT;
    // 효과 판정 결과를 누른 기록에 붙인다
    r.ag.log.forEach(e => { const p = r.presses.find(q => q.act === e.act && Math.abs(q.t - (e.t - (e.act === "press_down" ? 90 : 30))) <= 2 && q.ok === undefined); if (p) p.ok = e.good; });
    chart($("g" + i), v.gpcPoints, 0.95, 1.30, SIM.GPC_BAND, "var(--gpc)", 0.05, r.presses, s);
    chart($("u" + i), v.uPoints, 0.60, 1.50, SIM.U_BAND, "var(--uni)", 0.15, r.presses, s);
    $("k" + i).innerHTML = SIM.KNOB_ORDER.map(k => `<div class="${s.knobs[k] !== SIM.KNOBS[k].base ? "moved" : ""}"><div class="k">${SIM.KNOBS[k].label}</div><div class="v">${s.knobs[k].toFixed(SIM.KNOBS[k].dp)}</div></div>`).join("");
    const inG = g.gpc_true >= SIM.GPC_BAND[0] && g.gpc_true <= SIM.GPC_BAND[1], inU = g.uniformity_true <= SIM.U_BAND[1];
    const fixes = r.presses.filter(p => !p.undo && p.act === SIM.FIX[r.f]).length, wrong = r.presses.filter(p => !p.undo && p.act !== SIM.FIX[r.f] && p.act !== "request_clean").length;
    const undos = r.presses.filter(p => p.undo).length, cleans = r.presses.filter(p => p.act === "request_clean").length;
    const cause = last ? last.d.cause : "normal";
    $("j" + i).innerHTML = `<span class="mut">${since < 0 ? "주입 " + Math.ceil(-since) + "초 전" : "주입 후 +" + Math.floor(since) + "초"} · 판정</span> <span class="a">${KO[cause]}</span> → <span class="a">${last ? KO[last.act] : "대기"}</span><div class="w">${esc(last ? last.why : "")}</div>`;
    $("l" + i).innerHTML = r.presses.slice().reverse().map(p => `<div><span class="${p.undo ? "mut" : p.ok === false ? "bad" : p.ok ? "ok" : ""}">+${Math.round(p.t)}s ${esc(KO[p.act])}${p.ok === true ? " ✓ 들음" : p.ok === false ? " ✗ 안 들음" : ""}</span></div>`).join("") || '<span class="mut">아직 누른 버튼 없음</span>';
    const state = since < 0 ? '<span class="pill mut">주입 전</span>' : (inG && inU ? '<span class="pill ok">대역 안</span>' : '<span class="pill bad">대역 밖</span>');
    t += `<tr><td>${KO[r.f]}</td><td>${KO[cause]} ${r.f !== "normal" && since > 0 ? (cause === r.f ? '<span class="ok">✓</span>' : cause === "normal" ? "" : '<span class="bad">✗</span>') : ""}</td>
      <td style="white-space:normal;min-width:260px">${last ? KO[last.act] : "대기"} <span class="mut">· ${esc(last ? last.why : "")}</span></td>
      <td class="n">${r.firstAt === null ? "–" : "+" + Math.round(r.firstAt) + "초"}</td>
      <td class="n">맞음 ${fixes}${wrong ? ` · <span class="bad">잘못 ${wrong}</span>` : ""}${undos ? ` · 되돌림 ${undos}` : ""}${cleans ? ` · 클리닝 ${cleans}` : ""}</td>
      <td class="n ${inG ? "" : "bad"}">${g.gpc_true.toFixed(3)}</td><td class="n ${inU ? "" : "bad"}">${g.uniformity_true.toFixed(2)}</td><td>${state}</td></tr>`;
  });
  $("sum").innerHTML = t;
  const s0 = runs[0].sim, since = (s0.t - s0.injectTick) * SIM.DT;
  $("clock").textContent = `시드 ${baseSeed}~${baseSeed + 5} · ` + (since < 0 ? `주입까지 ${Math.ceil(-since)}초` : `주입 후 +${Math.floor(since)}초`);
}

let acc = 0, lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.25, (now - lastT) / 1000); lastT = now;
  if (!paused) { acc += dt * parseInt($("spd").value, 10) / 2; const n = Math.floor(acc); if (n > 0) { acc -= n; tickAll(n); draw(); } }
  requestAnimationFrame(loop);
}
$("restart").onclick = start;
$("pause").onclick = function () { paused = !paused; this.textContent = paused ? "재개" : "일시정지"; };
start(); requestAnimationFrame(loop);
</script>
